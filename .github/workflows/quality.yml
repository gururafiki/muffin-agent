name: Quality

# The merge gate for this repo: lint, unit tests, and — most importantly — the
# resolve+import smoke test, on PULL REQUESTS.
#
# Why this exists. Until 2026-08-08 the only check on a PR here was CodeQL, which
# reports NEUTRAL on a dependency-only diff, so `main` was effectively protected
# by nothing for the exact class of change most likely to break it. The
# resolve+import test DID exist, but only in build-image.yml on push-to-main,
# where `cancel-in-progress` can kill it: PR #145 widened the deliberate `mcp<2`
# cap to `<3` (reopening the 2026-07-28 GraphLoadError outage) and its build was
# cancelled by the next merge 12 seconds later. It shipped unverified.
#
# NOTE: deliberately NO `paths` / `paths-ignore` filter. This workflow is a
# REQUIRED status check, and a filtered workflow simply never reports on a PR
# that misses the filter — which leaves the PR blocked on a check that will
# never arrive. The whole job is ~2 minutes; running it on docs-only PRs is far
# cheaper than that failure mode.
#
# `mypy src/` and `ruff format --check` are NOT here yet: the tree currently has
# 50 mypy errors and 7 unformatted files, so adding them would land a gate that
# is red on arrival. They are added to the `checks` job by the typing-cleanup PR
# that fixes them. Keep the job id stable when doing so — the ruleset's required
# status check refers to it by name.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  # Superseded PR pushes are safe to cancel; a `main` commit is not — its result
  # is the record that the merged tree is sound. See the #145 post-mortem above.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Unit tests
        # 37 unit tests build a graph, and building one constructs the chat
        # model, which raises `ValueError: OpenAI API key not configured` when
        # the key is absent. They need the key to EXIST, not to be valid — no
        # request is ever made. Locally this is invisible because
        # `BaseConfiguration` calls `load_dotenv()` and a developer has a .env,
        # which is exactly why this only surfaced in CI.
        #
        # Ideally compiling a graph would not require credentials at all; until
        # that is worth changing (roadmap), a dummy value is the honest fix.
        env:
          OPENAI_API_KEY: dummy-key-not-used-no-request-is-made
        run: pytest -m unit --no-cov

  imports:
    # Duplicated on purpose with build-image.yml. There it is a pre-build gate
    # (never build an image from a tree that cannot import); here it is the merge
    # gate. The duplication is the point — the pre-build copy runs too late to
    # stop a bad dependency bound from reaching `main`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test resolution + imports in the runtime base image
        # Resolve and import against the SAME base image the runtime uses,
        # including its constraints file — an outage here came from deps that
        # installed fine but no longer imported. amd64 is fine without QEMU:
        # dependency resolution is what breaks, and that is arch-independent.
        # `muffin_agent.graph` is deliberately NOT imported: it builds a graph at
        # module level and needs MCP reachable.
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/src:ro langchain/langgraph-api:3.13 -c '
            set -e
            cp -r /src /build && cd /build && rm -rf .venv
            uv pip install --system -q --no-cache-dir -c /api/constraints.txt -e .
            python -c "import muffin_agent.agents.data_collection.utils"
            python -c "import muffin_agent.agents.criteria_analysis.graph"
            python -c "import muffin_agent.agents.personas_council.council_graph"
            python -c "import auth"
            python -c "import importlib.metadata as m; print(\"langgraph\", m.version(\"langgraph\"), \"mcp\", m.version(\"mcp\"))"
          '
