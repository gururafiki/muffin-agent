name: Build & push agent image

# Builds the Muffin agent (LangGraph standalone server) image for ARM64 and pushes to GHCR:
#   ghcr.io/<owner>/muffin-agent:latest
# Deployed by the `muffin-deployment` repo as the `langgraph-api` service. (Coexists with the legacy
# build-images.yml during the multi-repo migration; that one is removed once the new deploy is verified.)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "skills/**"
      - "langgraph.json"
      - "pyproject.toml"
      - "auth.py"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: build-agent-${{ github.ref }}
  # NEVER cancel a `main` build. Two merges seconds apart used to cancel the
  # first one's run, and with it the resolve+import smoke test below — which is
  # exactly how #145 (`mcp<2` widened to `<3`) shipped with no verification.
  # Queue main builds instead so every merged commit gets its own verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm # native arm64, free for public repos
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # An outage on 2026-07-28 shipped because dependencies INSTALLED but the
      # app no longer IMPORTED: mcp 2.0.0 dropped `RequestContext`, which
      # langchain-mcp-adapters imports at module level, so every graph failed to
      # load and the API sat at 0/1. Resolve + import against the same base
      # image the runtime uses, BEFORE building. Runs on amd64 without QEMU —
      # dependency resolution is what breaks here, and that is arch-independent.
      # `muffin_agent.graph` is deliberately NOT imported: it builds a graph at
      # module level and needs MCP reachable.
      - name: Smoke-test resolution + imports in the runtime base image
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/src:ro langchain/langgraph-api:3.13 -c '
            set -e
            cp -r /src /build && cd /build && rm -rf .venv
            uv pip install --system -q --no-cache-dir -c /api/constraints.txt -e .
            python -c "import muffin_agent.agents.data_collection.utils"
            python -c "import muffin_agent.agents.criteria_analysis.graph"
            python -c "import muffin_agent.agents.personas_council.council_graph"
            python -c "import auth"
            python -c "import importlib.metadata as m; print(\"langgraph\", m.version(\"langgraph\"), \"mcp\", m.version(\"mcp\"))"
          '

      - name: Generate LangGraph Dockerfile
        run: |
          pip install --upgrade langgraph-cli
          langgraph dockerfile Dockerfile.langgraph
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.langgraph
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/muffin-agent:latest
            ghcr.io/${{ github.repository_owner }}/muffin-agent:${{ github.sha }}
      # Auto-CD: tell muffin-deployment a fresh image is on GHCR so it redeploys the Swarm stack
      # (deploy.yml listens for repository_dispatch type=deploy). Needs a cross-repo PAT — the
      # built-in GITHUB_TOKEN can't dispatch to another repo.
      - name: Trigger deploy
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/muffin-deployment
          event-type: deploy
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
