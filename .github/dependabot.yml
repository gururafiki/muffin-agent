# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note there is no `docker` ecosystem here on purpose: this repo has no
# Dockerfile of its own — CI generates one with `langgraph dockerfile`, so the
# base image is chosen by langgraph-cli and tracked through that dependency.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for the routine noise, individual PRs for majors (which deserve to
    # be read). Without this the weekly batch is ~10 PRs, and reviewing them in
    # bulk is how #145 slipped through.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # There is deliberately no `mcp` entry here. muffin no longer declares a
      # direct `mcp` bound at all — the cap is inherited from
      # langchain-mcp-adapters, whose floor in pyproject.toml is what keeps mcp
      # on 1.x. Dependabot only proposes changes to bounds that exist, so there
      # is nothing here to widen. (It widened the old, useless `mcp<3` from `<2`
      # in #145; the fix was to delete the bound, not to guard it.)
      #
      # Both fork pins are direct git URLs at a fixed commit. Dependabot cannot
      # reason about them, and the version they shadow is decided by the
      # upstream issues in pyproject.toml, not by a release feed.
      - dependency-name: "langgraph"
      - dependency-name: "deepagents"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
