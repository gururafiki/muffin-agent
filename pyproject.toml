[project]
name = "muffin"
version = "0.0.1"
description = "MufFin agent for investment opportunities analysis"
authors = [
    { name = "Alex March", email = "broaden.your@outlook.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    # TEMPORARY FORK PIN — drop once langchain-ai/langgraph#8470 ships.
    # Status 2026-08-08: a maintainer took the fix over. muffin's own PR #8471
    # stayed closed (the require-issue-link bot), but langgraph#8538 is open and
    # co-authored to us, with a broader fix than ours (it also covers
    # `get_state(subgraphs=True)` and the update_state write path). NOT merged —
    # under review, with the reviewer questioning whether it is a bug at all.
    # Track #8538, not #8471.
    # Upstream: reading a NESTED subgraph's state hydrates every DeltaChannel
    # EMPTY, silently. `_prepare_state_snapshot` hydrates channels with
    # `self.checkpointer` alone, but a subgraph from `get_subgraphs()` was
    # compiled without one (the parent supplies it via CONFIG_KEY_CHECKPOINTER),
    # so DeltaChannels have no saver to replay their ancestor writes. Every deep
    # agent's `messages` IS a DeltaChannel — which is why muffin-ui saw empty
    # transcripts for every nested agent while the blobs sat in the DB.
    # Pinned to a COMMIT, not a branch, so builds stay reproducible.
    "langgraph @ git+https://github.com/gururafiki/langgraph@602d3f4610039194650fe4c056e95ddd0d86cc1c#subdirectory=libs/langgraph",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.3",
    "langchain-openrouter>=0.2.7",
    # Ollama Cloud / local Ollama via the native /api/chat API (reliable tool
    # calling; the OpenAI-compat /v1 path is not) — see model_config.py.
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.0",
    "langgraph-sdk>=0.4.2",
    # auth.py JWT verification (Supabase HS256; Cloudflare Access additionally
    # needs the crypto extra installed in the deployment image)
    "pyjwt>=2.13.0",
    # FLOOR IS LOAD-BEARING — do not lower below 0.3.2. This line is the ONLY
    # thing keeping mcp on 1.x.
    # mcp 2.0.0 removed `RequestContext` from `mcp.shared.context`, which
    # langchain-mcp-adapters imported at module level through 0.3.1 — so a
    # resolve that took mcp 2.0.0 made EVERY graph fail to load with
    # `GraphLoadError: cannot import name 'RequestContext'`. Not theoretical: it
    # took the deployed API to 0/1 on 2026-07-28, on a rebuild that changed
    # nothing else (muffin filed langchain-ai/langchain-mcp-adapters#589).
    # 0.3.2 fixed it upstream by declaring `mcp>=1.24.0,<2.0.0` itself, so the
    # cap is inherited transitively and this floor is what guarantees the capped
    # version is the one resolved.
    #
    # muffin deliberately declares NO direct `mcp` bound. It used to carry
    # `mcp<3`, which was a no-op: adapters' `<2.0.0` is strictly stronger, and
    # `<3` would have permitted mcp 2.0.0 — the exact version that caused the
    # outage — the moment it ever became the binding constraint. A bound that
    # cannot block the thing it names is worse than no bound, because it reads
    # like protection.
    #
    # Consequence worth knowing: real mcp-2 support is tracked upstream in
    # langchain-mcp-adapters#578. When it ships, adapters relaxes its cap and
    # mcp 2.x will arrive through a routine Dependabot bump of adapters. CI's
    # resolve+import smoke test gates that, but it imports four modules and does
    # NOT exercise MCP tool calling — so validate the tool path by hand when the
    # adapters major that enables mcp 2 lands. See roadmap.md.
    "langchain-mcp-adapters>=0.3.2",
    "langgraph-cli>=0.4.31",
    "pydantic>=2.13.4",
    # Prompt templating
    "jinja2>=3.1.6",
    # CLI
    "typer>=0.27.0",
    "rich>=15.0.0",
    # Observability
    "langfuse>=4.14.0",
    # PERMANENT FORK PIN — assume this is never upstreamed.
    # Tracked in langchain-ai/deepagents#5136 (NOT #5131, which the triage bot
    # closed as NOT_PLANNED for being filed programmatically; #5132, the PR, was
    # auto-closed pending assignment). As of 2026-08-08 #5136 has no maintainer
    # response, and a langgraph maintainer independently adjudicated it in the
    # langgraph#8538 thread: reading a subagent through tool indirection is a
    # DOCUMENTED, INTENTIONAL limitation, and the `tools:<uuid>` checkpoints were
    # declared "internal" when deepagents#4818 and #2629 were closed. This pin
    # lifts an intentional limitation rather than carrying a pending bugfix, so
    # budget for maintaining it indefinitely — re-check on each deepagents minor.
    # A `task` subagent's checkpoints are written but unreadable:
    # `get_state_history` on its namespace raises "Subgraph tools not found",
    # because namespace resolution reads `node.subgraphs` and a subagent lives
    # in the task tool's CLOSURE, invisible to auto-detection. Without this,
    # muffin-ui can show which sub-agents a stage called and what each returned,
    # but never what they did.
    # Branched from the 0.6.12 TAG, not main: main has moved on (it drops
    # `BackendFactory`, which subagent_refinement imports) and pinning it would
    # drag in unrelated breaking changes. Pinned to a COMMIT for reproducibility.
    "deepagents @ git+https://github.com/gururafiki/deepagents@f3a5d79574e18c57c31187a1c2cbbbefe097fd93#subdirectory=libs/deepagents",
    # Checkpointing (CLI persistence)
    "langgraph-checkpoint-sqlite>=3.1",
    # Sandbox. The OpenSandbox backend, the thread-scoped sandbox factory and
    # the generic `execute_python` tool were extracted to their own package on
    # 2026-08-08 — none of it was finance-specific, and OpenSandbox was the one
    # mainstream sandbox provider with no LangChain partner package. muffin
    # keeps only the store bridge tools (they need `AccessControlledStore`).
    # Pinned to a COMMIT until 0.1.0 is on PyPI; then this becomes a version
    # bound. `opensandbox` itself arrives transitively through it.
    # `opensandbox-code-interpreter` was dropped in the same pass — it had been
    # declared since the original sandbox work and imported nowhere.
    "langchain-opensandbox @ git+https://github.com/gururafiki/langchain-opensandbox@ccabc4570314fca12066820d4d3b49a95b5a4ee5",
    # Technical-indicator computation (trading_decision Market analyst)
    "stockstats>=0.6.8",
    "pandas>=3.0.5",
    # Required by pandas.DataFrame.to_markdown() (trading_decision tools).
    "tabulate>=0.10",
]

[project.scripts]
muffin = "muffin_cli.main:main"


[project.optional-dependencies]
dev = [
    "mypy>=2.1",
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3",
    # pandas ships no inline types; without the stubs mypy reports
    # `import-untyped` on tools/technicals.py.
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = ["*.jinja"]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP"
]
lint.ignore = []
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
# Persona / specialist modules are heavy on small typed Pydantic sub-evidence
# models and persona-specific scorer/node functions whose names + Pydantic
# field types are fully self-documenting.  Module-level docstrings explain the
# subgraph architecture; class/function docstrings would be noise.
"src/muffin_agent/agents/personas_council/personas/*.py" = ["D101", "D103"]
"src/muffin_agent/agents/personas_council/specialists/*.py" = ["D101", "D103"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# `mypy src/` had no configuration at all and 50 errors, so it was documented in
# CLAUDE.md but never enforced. It is now a required CI check — see
# .github/workflows/quality.yml.
python_version = "3.13"
# Almost everything in this codebase is a Pydantic model (configuration, agent
# state, every structured output). The plugin teaches mypy how model `__init__`
# signatures are actually generated, which on its own removed 6 false
# `arg-type` errors about passing a sub-model where a field is declared.
plugins = ["pydantic.mypy"]
# Deliberately NOT strict. The value here is catching real defects — this pass
# found two CLI commands importing names that do not exist, and arithmetic on
# `None` in a persona scorer. Turning on `disallow_untyped_defs` across a
# 176-module tree would bury those in thousands of annotation chores.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# stockstats and tabulate ship no type information and have no stubs package.
module = ["stockstats.*", "tabulate.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
